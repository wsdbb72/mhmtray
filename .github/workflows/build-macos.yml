name: Build macOS

on:
  push:
    paths:
      - '.github/workflows/build-macos.yml'
      - 'mihomo-tray-macos/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mihomo-tray-macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: mihomo-tray-macos/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w" -o mihomo-tray .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-tray-macos
          path: mihomo-tray-macos/mihomo-tray
          if-no-files-found: error
