name: Build macOS
on:
  push:
    paths:
      - "mihomo-tray-macos/**"
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build
        working-directory: mihomo-tray-macos
        run: |
          go mod tidy
          CGO_ENABLED=1 go build -ldflags="-s -w" -o mihomo-tray .
          mkdir -p MihomoTray.app/Contents/MacOS
          cp mihomo-tray MihomoTray.app/Contents/MacOS/
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-tray-macos
          path: mihomo-tray-macos/MihomoTray.app