name: Release Desktop

on:
  push:
    tags:
      - "desktop-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mihomo-tray
    steps:
      - uses: actions/checkout@v4

      - name: Build Windows
        shell: cmd
        run: build.bat

      - name: Package Windows
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -LiteralPath MihomoTray.exe -DestinationPath "dist/MihomoTray-Windows-$tag.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: mihomo-tray/dist/*.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - name: Build macOS
        working-directory: mihomo-tray-macos
        run: bash ./build.sh

      - name: Create DMG
        run: |
          tag="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          hdiutil create -fs HFS+ -srcfolder mihomo-tray-macos/MihomoTray.app -volname MihomoTray "MihomoTray-macOS-$tag.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: MihomoTray-macOS-*.dmg

  release:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums and notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          cd dist
          sha256sum * > SHA256SUMS.txt
          {
            echo "Desktop build for ${tag}."
            echo
            echo "Assets:"
            echo "- Windows zip"
            echo "- macOS DMG"
            echo "- SHA256SUMS.txt"
          } > RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          assets=(dist/*.zip dist/*.dmg dist/SHA256SUMS.txt)

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "MihomoTray Desktop $tag" --notes-file dist/RELEASE_NOTES.md
          fi
